[package]
name = "memcache"
version = "0.20.0"
authors = ["An Long <aisk1988@gmail.com>"]
repository = "https://github.com/aisk/rust-memcache"
readme = "README.md"
license = "MIT"
description = "memcached client for rust"
keywords = ["memcache", "memcached", "driver", "cache", "database"]
edition = "2024"

[features]
default = ["tls"]
tls = ["openssl"]
tokio = ["dep:tokio"]

[dependencies]
byteorder = "1"
url = "^2.1"
rand = "0.10"
enum_dispatch = "0.3"
openssl = { version = "^0.10", optional = true }
r2d2 = "^0.8"
tokio = { version = "1", features = ["io-util", "net", "time"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net", "rt", "macros", "time"] }
